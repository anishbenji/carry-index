# GitHub secret scanning: skip the copied gitleaks policy. Its gcp-api-key allowlist holds gitleaks' own 16 public
# sample keys (upstream v8.30.1 config, byte-identical; see the header of gitleaks.toml), which GitHub otherwise
# reports as Google API keys. gitleaks in ci.yml still scans every file, this one included.
paths-ignore:
  - ".github/gitleaks.toml"
