# Deploys the public site (ADR-0049, privacy-wall design v2 sections 3, 7 and 8). Two jobs:
#   build   no credentials and no environment: builds the site, runs the gate's check on it, uploads it.
#   deploy  main only, in environment public-production: downloads the build, and the gate seals, scans, runs
#           check 3 (dry run), deploys, then confirms the live Worker's bindings and rolls back if they differ.
# The Cloudflare token reaches exactly one step, the gate's deploy, through that step's env. The structure is
# tested by packages/deploy/test/t10-workflows.test.ts; docs/deploy.md is the owner's guide.
name: deploy-public

on:
  push:
    branches: [main]
  # Daily rebuild and redeploy, so /performance stays current (decision #17, 3A).
  schedule:
    - cron: "17 4 * * *"
  # First deploys, and redeploys by hand; the deploy job still runs only on main.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a running deploy is never cancelled (a newer run waits).
concurrency:
  group: deploy-public
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Install (frozen lockfile, no package scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        run: bun run build
      - name: Deploy gate check (checks 1 and 2, seal and scan; spawns nothing)
        run: node packages/deploy/src/bin.ts check apps/web/dist/client
      - name: Upload the checked site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-site
          path: apps/web/dist/client
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: public-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Install (frozen lockfile, no package scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download the checked site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public-site
          path: ${{ runner.temp }}/public-site
          digest-mismatch: error
      - name: Deploy through the gate (seal, scan, check 3, deploy, live check with rollback)
        run: node packages/deploy/src/bin.ts deploy "${{ runner.temp }}/public-site"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
