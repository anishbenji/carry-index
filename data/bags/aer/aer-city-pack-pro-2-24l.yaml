    about: 24L; fabric tested not stated, weight quoted is the ballistic nylon one, so apparently not Ultra (updated 2026-09-22)
  replaces: cpp2-pro-1
  wording_note: 'One Stranded Variable review of this build. ''Zero issues across a dozen packs'' has no source; ranking against Able Carry left out. 17 Nov 2026: support widened with John Scott, GearByWomen (research/reviews-2026-11-17/merged/cpp2.json point 0); was ''one review''. John Scott (1680D Cordura ballistic nylon, loads of 30 to 35 lb, two months) and GearByWomen (Cordura ballistic nylon) both call it very comfortable. Build label ''Also from video reviews of the Cordura ballistic nylon build'' added because the new sources cover other builds. Reworded the same day from ''Comfort rated very good after about three months of daily carry.'' to ''Comfortable to carry.''. Anish accepted this wording on 17 Nov 2026 (''ok''), so that the line says only what all its sources back.'
  from_build:
    label: Also from video reviews of the Cordura ballistic nylon build
    decided: '2026-11-17'
