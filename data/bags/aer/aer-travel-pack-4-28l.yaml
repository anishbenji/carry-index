  status: approved
  source_notes:
  - source: visionswell-aer-travel-pack-4-ultra
    about: same build; hands-on with packing demo (page also shows 2026-11-05)
  - source: nomads-nation-aer-travel-pack-4-28l-vs-35l-review
    about: 28L and 35L in 1680D Cordura, not Ultra; affiliate links, and the author runs his own bag brand
  other_builds:
  - source: nomads-nation-aer-travel-pack-4-28l-vs-35l-review
    about: 28L and 35L in 1680D Cordura, not Ultra (updated 2026-11-10)
  replaces: tp4-con-1
  wording_note: 'visionswell''s subjective, unmeasured impression. The Modern Xplorer only relays ''other reviewers'', so not independent; ''true capacity'' overstated. 17 Nov 2026: support widened with Nomads Nation (research/reviews-2026-11-17/merged/tp4.json point 5); was ''one review''. Nomads Nation (28L in 1680D Cordura) lists ''28L feels tighter than expected'' as a con. Build label ''Also from a review of the 28L 1680D Cordura build'' added because the new sources cover other builds. Reworded the same day from ''Feels closer to 26 L than the listed 28 L in use.'' to ''Feels smaller than the listed 28 L once loaded.''. Anish accepted this wording on 17 Nov 2026 (''ok''), so that the line says only what both sources back; the 26 L figure was visionswell''s alone.'
  from_build:
    label: Also from a review of the 28L 1680D Cordura build
    decided: '2026-11-17'
