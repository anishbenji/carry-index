  - source: desy-cheng-video-aer-travel-pack-4-honest-review
    about: 28L and 35L, fabric not stated; bags sent by Aer, not paid, affiliate links
  replaces: tp4-con-2
  wording_note: 'No source ties this to a stiff shell or says stiffness protects contents. Keeps the Modern Xplorer finding only. 17 Nov 2026: support widened with Nomads Nation, Desy Cheng (research/reviews-2026-11-17/merged/tp4.json point 6); was ''one review''. Nomads Nation (28L Cordura) says it ''does not feel overly spacious once everything is loaded in''; Desy Cheng (28L, fabric not stated) found it ''crammed to its max'' with a larger loadout. Build label ''Also from a 28L 1680D Cordura review and one that doesn''t name its fabric'' added because the new sources cover other builds.'
