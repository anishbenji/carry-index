claims:
- id: tp4-pro-2
  kind: pro
  text: Organisation for travel is a strong point.
  voice: reviewers
  support: four reviews agree
  scope: design
  basis: sibling
  sources:
  - better-trail-aer-travel-pack-4-review
  - stranded-variable-review-aer-travel-pack-4-35l
  - pack-hacker-travel-pack-4-28l
  - everyday-carry-and-tech-video-aer-travel-pack-4-ultra-28l
  observed_on:
  - travel-pack-4-ultra-28l
  from_build:
    label: Mostly from reviews of the 35L 1680D Cordura and 28L X-Pac VX-42 builds
    generation: Same generation (Travel Pack 4)
    size: 28L for the X-Pac VX-42 review; 35L for the two Cordura reviews
    fabric: X-Pac VX-42 and 1680D Cordura
    assigned: 'yes'
    found: Aer's pages list the same pockets and compartments for the 28L Ultra and the 28L Cordura.
    decided: '2026-11-13'
  status: approved
  source_notes:
  - source: better-trail-aer-travel-pack-4-review
    about: 35L in 1680D Cordura, not Ultra and not 28L
  - source: stranded-variable-review-aer-travel-pack-4-35l
    about: 35L in 1680D Cordura, not Ultra and not 28L
  - source: pack-hacker-travel-pack-4-28l
    about: 28L in X-Pac VX-42, not Ultra (updated 2026-10-19)
  - source: everyday-carry-and-tech-video-aer-travel-pack-4-ultra-28l
    about: same build; about two months of use; no sample, sponsor or affiliate statement
  replaces: tp4-pro-2
  wording_note: 'Praise is on other builds. ''Three independent compartments'' has no source; ''among the best at this size'' is an unsourced ranking. 17 Nov 2026: support widened with Everyday Carry and Tech (research/reviews-2026-11-17/merged/tp4.json point 3); was ''reviewers agree''. Everyday Carry and Tech, on the Ultra 28L, says ''there''s lots of pockets in here. Ample storage''. Build label changed from ''From reviews of the 35L 1680D Cordura and 28L X-Pac VX-42 builds'' to ''Mostly from reviews of the 35L 1680D Cordura and 28L X-Pac VX-42 builds'' to fit the wider sources.'
- id: tp4-pro-3-b
  kind: pro
  text: Load lifters and comfortable straps help keep a heavy load comfortable.
  voice: reviewers
  support: two reviews
  scope: design
  basis: sibling
  sources:
  - better-trail-aer-travel-pack-4-review
  - stranded-variable-review-aer-travel-pack-4-35l
  observed_on: []
  from_build:
    label: From reviews of the 35L 1680D Cordura build
    generation: Same generation (Travel Pack 4)
    size: 35L, larger than this bag
    fabric: 1680D Cordura
    assigned: 'yes'
    found: Aer lists load lifters, a framesheet and hip-belt points on the 28L Ultra too. The 25 lb test was on the 35L.
    decided: '2026-11-13'
  status: approved
  source_notes:
  - source: better-trail-aer-travel-pack-4-review
    about: 35L in 1680D Cordura, not Ultra and not 28L
  - source: stranded-variable-review-aer-travel-pack-4-35l
    about: 35L in 1680D Cordura, not Ultra and not 28L; bag sent by Aer before release, no payment, no affiliate links
  replaces: tp4-pro-3
  wording_note: 'Split from pro-3. Better Trail''s 25 lb carry was on the 35L Cordura; no Ultra 28L load test exists. 17 Nov 2026: support widened with Stranded Variable (research/reviews-2026-11-17/merged/tp4.json point 1); was ''one review''. Stranded Variable (35L in 1680D Cordura) carried 21 lb on a two-hour walk and says the load lifters and sternum strap ''help distribute weight extremely well''. Reworded the same day from ''Load lifters and framesheet kept a 25 lb (11 kg) load comfortable.'' to ''Load lifters and comfortable straps help keep a heavy load comfortable.''. Anish wrote this wording on 17 Nov 2026 (''Load lifters, comfortable straps help keep a heavy load comfortable.''; ''and'' added for grammar). Better Trail''s review, opened again through WebFetch the same day, credits the load lifters and ''generously padded shoulder straps'' with upwards of 25 pounds; the 25 lb figure and the framesheet are no longer in the line.'
- id: tp4-con-1
  kind: con
  text: Feels smaller than the listed 28 L once loaded.
  voice: reviewers
  support: two reviews
  scope: design
  basis: review
  sources:
  - visionswell-aer-travel-pack-4-ultra
  - nomads-nation-aer-travel-pack-4-28l-vs-35l-review
  observed_on:
