    covers: 'CT15 Plus - ULTRA200X (same 2026 generation and same shell fabric as the Lite ULTRA200X; adds the ''Plus'' front section; maker lists it at 28 L and 20.5 cm deep). One Judge.me review by ''Jan K'', dated 04/09/2026, title ''Incredible workmanship''. Discloses: Maker''s own store page. Review marked ''Review collected via store invitation''. The widget header shows a verified checkmark next to the review count; purchase status of this reviewer is not otherwise stated.'
