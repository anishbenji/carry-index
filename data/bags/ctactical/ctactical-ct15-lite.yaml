    used_for:
    - ct15l-pro-6
    - ct15l-pro-7
  - source: ctactical-ct15-lite-robic-nylon-420d-ripstop
    covers: 'Page title confirmed: ''CT15 Lite - ROBIC® Nylon 420D Ripstop'' (2026 generation Lite, different fabric; listed at $109 regular price). One anonymous Judge.me review dated 04/14/2026, ''Very nice backpack''. Discloses: Maker''s own store page. Anonymous reviewer; ''Review collected via store invitation''.'
    used_for: []
  sourcing: Based on Ctactical's own pages, an owner review of the CT15 Plus on Ctactical's site, and PK Shiu's first-look video of the waxed canvas CT15 Lite.
