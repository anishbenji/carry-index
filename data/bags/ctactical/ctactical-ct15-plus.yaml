    used_for:
    - ct15p-pro-7
  - source: bagdad-video-c-tactical-ct15-plus-review
    covers: 'Stock CT15 Plus in ROBIC 420D ripstop with J-straps (other fabric); also shows his custom group-buy versions (Dyneema; X-Pac/EcoPak) with S-straps. Discloses: Says ''I paid for every one of these'' and makes nothing off it (caption garbles the brand name); says some brands he is affiliated with, some not; description has affiliate-style links (alnk.to, aspr, Amazon)'
    used_for:
    - ct15p-pro-4
    - ct15p-pro-6
    - ct15p-pro-7
  - source: ctactical-ct15-plus-cordura-nylon-1000d
    covers: 'CT15 Plus - Cordura Nylon 1000D, other fabric; 3 Judge.me reviews dated 08/22-09/11/2026 (Tony Matthews, Anonymous, Jay). Discloses: Maker''s own store; each review shows ''Review collected via store invitation'''
    used_for: []
  - source: ctactical-ct15-plus-robic-nylon-420d-ripstop
    covers: 'CT15 Plus - ROBIC Nylon 420D Ripstop, other fabric; 12 reviews (4.58/5), 5 shown, dated 06/12-07/04/2026. Discloses: Maker''s own store; each review shows ''Review collected via store invitation'''
    used_for: []
