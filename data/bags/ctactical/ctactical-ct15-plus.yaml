  - source: pk-shiu-video-ctactical-ct15-plus-deep-dive
    about: 2026 CT15 Plus, fabric not named in the video (the description points to the ROBIC nylon build); no sample or sponsor statement
  - source: bagdad-video-c-tactical-ct15-plus-review
    about: CT15 Plus in ROBIC 420D nylon, a different fabric; he paid for it himself; affiliate-style links
  wording_note: 'New on 13 Nov 2026, from the one owner review on Ctactical''s page for this build (undated, read through WebFetch). Not on the old page. 17 Nov 2026: support widened with George DEFINED, PK Shiu, Bagdad (research/reviews-2026-11-17/merged/ct15p.json points 0, 1); was ''one owner review''. George DEFINED (same build, about three months) calls the straps ''really freaking comfortable'' and says the back pads ''give you a lot of venting''. PK Shiu (''very, very comfortable'', ''quite thick with an air channel'') and Bagdad (''These straps are very comfortable'', ''a strip going down right here for airflow'') reviewed other fabric builds. Build label ''Also from reviews of the ROBIC nylon build; one doesn''t name its fabric'' added because the new sources cover other builds. Reworded the same day from ''Comfortable harness, and the somewhat airy back panel helps in Singapore''s weather.'' to ''Comfortable harness, and an air channel down the back panel helps airflow.''. Anish
    accepted ''Comfortable harness, with an air channel in the back panel.'' on 17 Nov 2026 and asked for more emphasis on the airflow (''Looks good, try to emphasis the airflow a bit more''). Only the owner mentions Singapore''s weather, so that is no longer in the line. George DEFINED alone says it gives ''a lot of venting''; the line stays with what all four back.'
