    used_for: []
  - source: the-brooks-review-p-34836
    covers: 'CT21 V3.0 Slick, X-Pac X50 with bottle pockets, 21 L, $189 (earlier generation); 19 Mar 2026. Discloses: Bought it himself; site uses affiliate links whenever possible'
    used_for: []
  - source: nomads-nation-ctactical-ct14-plus-review
    covers: 'other build: CT14 Plus in 420D ripstop nylon (different model and fabric)'
    used_for: []
  - source: nomads-nation-ctactical-ct21-v3-review
    covers: 'CT21 V3 (earlier generation), 500D Cordura, 21 L, no built-in bottle pockets; published 28 Sep 2025, updated 7 Nov 2026. Discloses: Unlabelled ''Check Best Price'' redirect links; author promotes his own bag brand (Fyro) on the page; no sample or sponsor statement'
    used_for: []
  - source: zelpio-c-tactical-ct21-vs-goruck-gr1
    covers: 'other build: CT21 V2.0/V3.0 in 500D Cordura; unsigned, hands-on status unclear'
    used_for: []
  - source: the-perfect-bag-video-ct21-plus-vs-ct21-lite
    covers: 'CT21 Lite vs CT21 Plus, the ''upgraded CT21'', posted 12 Aug 2026. Lite: single compartment, two front-panel pockets, laptop and tablet sleeves, zippered side pocket and zippered bottle pocket; he measures it 13 x 18.5 x 6.5 in. No fabric is named for the bags shown. He praises the waxed canvas version and its olive, slate and chestnut colours, so the pair shown may be waxed canvas, not ULTRA. Says orange lining on most colours, blue on slate gray and navy. Discloses: Says he paid for both bags and they were not gifted by CTactical. Channel policy: no payments from bag makers; Amazon affiliate links used, including for the leather handles he added'
    used_for:
    - ct21l-pro-5
    - ct21l-pro-6
  - source: pangolins-with-packs-chuyen-tactical-ct21-v3-backpack-review
    covers: 'CT21 v3 Slick with bottle pockets, ECOPAK EPX240, 21 L (earlier generation); 24 May 2026. Discloses: Sample provided by CT for review; promises honest opinions'
    used_for: []
  - source: freds-blog-ctactical-ct21-backpack
    covers: 'CT21 V3.0 Slick ECOPAK EPX400 with bottle pockets, 21 L (earlier generation); 12 Aug 2025. Discloses: Owner post; bought it for $139; no affiliate or sponsor statement'
    used_for: []
  - source: fazal-majid-blog-backpacks
    covers: 'CT21 V3 in Ultra 200TX (earlier generation); page undated, and its loadout lists 2025-era gear, so it is a living page and the 2021-03 date is unconfirmed. Discloses: Nothing stated about affiliates or samples; says these are bags he has owned and used'
    used_for: []
  - source: the-perfect-bag-video-ct21-waxed-canvas-project-alchemy
    covers: 'CT21 21 L ''Heritage'' Project Alchemy group buy in Halley Stevenson waxed canvas with lilac lining he chose, posted 8 Oct 2024; earlier special run, not the Lite. Discloses: He joined the Facebook group buy, so he presumably bought it (payment not stated outright). Channel policy: no payments from bag makers; Amazon affiliate links used'
    used_for: []
  sourcing: Based on The Perfect Bag's video of the CT21 Lite, plus Ctactical's own pages.
