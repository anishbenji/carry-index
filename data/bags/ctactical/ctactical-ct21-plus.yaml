    covers: '2026 CT21 Plus in blue waxed canvas; 5-minute walkthrough, he says he is not doing a full review. Not an Ultra build. Discloses: Nothing said in the video about how he got it or about samples. Description: some bags shown are personally owned and may be sold; links to geareg.com. First check saw an AvantLink affiliate ID in the channel blurb.'
    used_for:
    - ct21p-pro-5
    - ct21p-pro-6
    - ct21p-pro-7
    - ct21p-pro-8
  - source: the-perfect-bag-video-ct21-plus-vs-ct21-lite
    covers: 'Upgraded (2026) CT21 Plus beside the CT21 Lite; mainly dimensions and the extra Plus compartment. Waxed canvas colourways discussed (olive, slate, chestnut); no Ultra build. He measured the Plus at 7.5 in deep, panel to panel. Discloses: Says in the video he paid for both bags and they were not gifted by Ctactical. Description: no payments or affiliate links from bag makers; Amazon affiliate links are used.'
    used_for: []
  - source: ctactical-ct21-plus-ultra200x
    covers: 'Ctactical product page for CT21 Plus - ULTRA200X, Black Magic, 33L, 1390 g, 18.7 x 13.4 x 8.4 in; regular price $245 (sale $232.75). One Judge.me review, 07/24/2026, by Randy Crocker. Discloses: Maker''s own page and review widget; review marked ''Review collected via store invitation''. Reviewer not individually labelled as a verified buyer.'
    used_for:
    - ct21p-pro-4
