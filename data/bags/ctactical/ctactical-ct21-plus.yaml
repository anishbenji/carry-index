  - source: visionswell-video-ctactical-ct21-plus-review
    covers: 'CT21 Plus (title, description, tags ''ct21 plus 33l''; he says ''the CT21'' aloud, and gives 18.7 in height, matching the Plus) in navy Halley Stevensons P400 waxed canvas, light blue Robic nylon interior, $189. Fully loaded demo with a week of gear; he says he has used it ''a bunch''. Not an Ultra build. Discloses: Says twice in the video he bought this bag with his own money. Description: affiliate shortlinks, Amazon Associates, and ''Brands often provide me with free gear''.'
