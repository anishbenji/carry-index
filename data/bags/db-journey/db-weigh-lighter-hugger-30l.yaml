  - source: dream-big-travel-far-db-hugger-backpack-review
    covers: 'Current standard polyester Db Hugger Backpack 30L Black Out (page lists 1.07 kg, $229, 100% polyester); last updated 8 Jan 2024. Not the Graflyte build. Discloses: Says some posts contain affiliate links (Db links are tracked affiliate links); does not say whether the bag was bought or gifted.'
    used_for:
    - wlh30-con-2-b
    - wlh30-pro-5
  - source: worn-wound-hands-on-d-b-journey-hugger-30l-backpack
    covers: 'Standard Db Journey Hugger 30L ($229, ''100% Polyester Bluesign GRS''); published 24 Dec 2024 after a few months of use. Not the Graflyte build. Discloses: No affiliate, gift or sponsorship disclosure on the page; author describes finding and choosing the bag himself.'
    used_for:
    - wlh30-pro-6
  - source: stoked-for-travel-p-9462
    covers: 'Db-era standard Hugger 30L (1.2 kg, US$179) tested alongside the Backpack Pro; published Aug 2021. Older generation. Discloses: Amazon links carry affiliate tags; does not say whether bags were bought, gifted or sponsored.'
    used_for:
    - wlh30-con-2-b
    - wlh30-pro-5
    - wlh30-pro-6
  - source: pack-hacker-the-hugger-30l
    covers: 'Douchebags-era Hugger 30L (spec block 1.4 kg, 15-inch laptop); published 2019-06, updated 2023-11. Page text is only a spec block and a three-line usage note; video not transcribed. Discloses: Reader-supported, may earn affiliate commission; Pro member discount on Db; no statement on whether the bag was gifted.'
    used_for:
    - wlh30-pro-5
  - source: the-adult-man-db-bags-review
    covers: 'Db-era standard Hugger 30L Blackout (EVA/PU front) plus a 20L; published June 2021, updated Apr 2024. Older generation. Discloses: Sponsored post with affiliate links; received compensation and courtesy product from Db; discount code offered.'
    used_for: []
  - source: the-loam-wolf-review-douchebags-hugger-30l
    covers: 'Original-generation Douchebags Hugger 30L: photos uploaded 2018-05, price $159, 15-inch laptop sleeve, two compartments. Page modified 2024-12 but content is from 2018. Discloses: Nothing stated (''When this bag first showed up'' hints it was supplied, but no disclosure).'
    used_for: []
  - source: toms-lode-video-db-the-hugger-backpack-review
    covers: 'Current standard polyester Db Hugger 30L, Black (1.23 kg, EUR 220); says the hook system was upgraded since the 2023 bag; uploaded 9 Jul 2025 after one week of use. Not the Graflyte build. Discloses: Says ''I bought a new bag''; no sponsorship or gift stated; description lists contact emails only.'
    used_for:
    - wlh30-con-2-b
    - wlh30-pro-6
  - source: joris-van-der-kamp-video-db-journey-hugger-30l
    covers: '''New version'' standard polyester Db Journey Hugger 30L, Moss Green; uploaded 27 Jul 2024, conclusion after two months and a trip to Scotland. Not the Graflyte build. Discloses: Says he chose the bag; does not say whether it was bought or gifted; no sponsorship stated; description lists a business-inquiry email.'
    used_for:
    - wlh30-pro-6
  - source: james-wright-video-douchebags-30l-hugger-1-year-review
    covers: 'Original-generation Douchebags 30L Hugger (2017-18), bought over a year before the 12 Aug 2018 upload; owner in Finland, used for work, gym, travel and treks. Discloses: Says ''I originally purchased this bag''; no sponsorship or gift stated.'
    used_for: []
  - source: verkkokauppa-db-hugger-backpack-30-l
    covers: 'Standard Db Hugger Backpack 30L; listing is reflective black but all 7 reviews are marked as written about sibling colourways (black out, sand grey, line cluster). Reviews dated 6.8.2024 to 25.9.2026, mostly Finnish. Current generation. Discloses: Retailer customer review section; 7 reviews, all 5 stars; nothing else stated.'
    used_for:
    - wlh30-pro-5
  - source: active-traveller-douchebag-the-hugger-30l-backpack
    covers: 'Original-generation Douchebags The Hugger 30L (GBP 126, 15-inch laptop pocket); last updated 25 Jul 2018. Discloses: Nothing stated about purchase, gifting or affiliates (page carries display ads).'
    used_for: []
