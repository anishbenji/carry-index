    generation: Same generation
    size: Same, 26L (the owner names the CTB26)
    fabric: 420D nylon
    assigned: 'yes'
    found: Evergoods lists the usual CIVIC Travel Bag pocket set on the ULTRA page; it does not say outright that the layout is identical.
    decided: '2026-11-13'
  status: approved
  source_notes:
  - source: evergoods-civic-travel-bag-26l
    about: 420D nylon build, not ULTRA; maker specs plus owner reviews pooled across 20L/26L/35L (514 total, about 40 visible, dated 2026-07 to 2026-11); the owner reviews cited name the CTB26
  - source: pack-hacker-civic-travel-bag-26l-ctb26
    about: 420D nylon build, not ULTRA; affiliate links, sample status not stated
  - source: rushfaster-reviews-io-evergoods-ctb26
    about: earlier CTB26 build, fabric not stated (reviews posted before the ULTRA build); verified-buyer reviews on a retailer's review page
  - source: mukama-evergoods-civic-travel-bag-26-l-ultra
    about: same build; one verified customer review on a retailer's page
  - source: danny-packs-video-evergoods-ctb26-revisited
    about: X-Pac build (Carryology Phoenix 2 collaboration), same design; affiliate links, no sample statement
  replaces: ctb26-pro-1
  wording_note: 'One 420D owner, not a repeated line. Yoke, stash and security detail unsupported; second owner''s point split to -b. 17 Nov 2026: support widened with Pack Hacker, Rushfaster, Mukama, Danny Packs (research/reviews-2026-11-17/merged/ctb26.json points 0, 1); was ''one owner review''. Pack Hacker (420D nylon), a Rushfaster owner (earlier build) and a Mukama owner (ULTRA) all confirm lots of pockets and good organisation. Danny Packs (X-Pac build) says the front pocket adds space ''without eating into the main compartment''. Build label changed from ''From reviews of the 420D nylon build'' to ''Also from reviews of the 420D nylon, X-Pac and earlier builds'' to fit the wider sources. Reworded the same day from ''Plenty of pockets, with some left spare.'' to ''Plenty of well-organised pockets, none eating into each other or the main compartment.''. Anish asked on 17 Nov 2026 for his two pocket lines to be one. No single source states the whole line: Pack Hacker, a Rushfaster owner
    and a Mukama owner back plenty of pockets and good organisation, the Evergoods owner review backs pockets not robbing each other, and Danny Packs backs not eating into the main compartment. This line now also covers ''Filling one pocket does not eat into the space of the others.'' (ctb26-pro-1-b), merged into it the same day at Anish''s call.'
