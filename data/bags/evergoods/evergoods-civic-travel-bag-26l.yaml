claims:
- id: ctb26-pro-1
  kind: pro
  text: Plenty of well-organised pockets, none eating into each other or the main compartment.
  voice: owners
  support: five reviewers and owners agree
  scope: design
  basis: sibling
  sources:
  - evergoods-civic-travel-bag-26l
  - pack-hacker-civic-travel-bag-26l-ctb26
