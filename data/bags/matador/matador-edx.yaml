  - source: jb-outside-video-matador-x-carryology-edx-backpack-and-sling
    covers: 'FIRST EDX (EDX Series ''Trident'', 2023) 22 L backpack in black Dimension Polyant X-Pac VX07, plus the 2 L sling; video uploaded 2023-07-04. Out-of-the-box walkthrough and first impressions; he ''wore it around'' but has not travelled with it or rain-tested it. Not the Ultra. Discloses: Description: ''This video and description contain affiliate links'' (includes a bit.ly link to the EDX). Spoken: he ''went in and bought the things individually'' after missing the bundle. No gifted sample or sponsorship stated.'
    used_for:
    - edx-pro-5
    - edx-pro-6
    - edx-con-5
    - edx-con-6
  - source: iron-heart-forum-905157
    covers: 'Anesthetist, 29 Jul 2025, on the ''last run'', posted the day before the Ultra launch in a thread about the Ultra. On the same page Graeme links ''last iteration'' to the EDX Lite article, so ''last run'' = EDX Lite (2024). The post does not name the model; the Lite reading is from context. Not the Ultra. Discloses: Forum owner post; no affiliate, gift or sponsorship. The post itself does not say he owns it, but his July 2024 posts on s3''s page show he bought the 2024 bag.'
    used_for: []
  - source: iron-heart-forum-821556
    covers: 'Anesthetist, 7 Jul 2024, ''Latest Carryology buys ... The Matador is nice''. Three weeks after the EDX Lite drop (17 Jun 2024). Post 821506 on the same page: ''I bought one for me and one for my better half'' (a reply to Graeme''s post 817228, not on this page). The model name is not in the text; it is shown only in photos I could not view. EDX Lite by date and context. Not the Ultra. Discloses: Owner post (bought it himself); no affiliate or sponsorship.'
    used_for: []
  - source: carryology-collaboration-par-matador-x-carryology-edx-ultra-collection-ex
    covers: 'EDX Ultra release page (Taylor Welden, 30 Jul 2025): backpack 22 L, 520 g, 7.8 x 10.8 x 17.9 in, Challenge Ultra 200TX, full feature list. Used for the version history only. Discloses: Co-maker page (Carryology), not independent.'
    used_for: []
  - source: carryology-collaboration-par-exclusive-release-matador-x-carryology-edx-s
    covers: 'First EDX (EDX Series) release page, 24 Jun 2023: backpack 22 L, 425.2 g, 7.75 x 10.75 x 17.875 in, X-Pac VX07, full feature list. Used for the version history only. Discloses: Co-maker page, not independent.'
    used_for: []
  - source: carryology-collaboration-par-matador-x-carryology-advancing-to-edx-lite
    covers: 'EDX Lite design article, 14 Jun 2024: lists what changed from V1 (Robic UHMWPE nylon on front lower panel, side panels and shoulder straps; mono mesh back replaced by printed VX07; side handles moved to form pass-through; new laptop sleeve closure). Version history only. Discloses: Co-maker page, not independent.'
    used_for: []
  - source: matador-x-carryology-edx-ultra-backpack
    covers: 'EDX Ultra backpack product page. The WebFetch feature list matches s4 word for word (foam-padded shoulder straps, secondary main zipper, internal admin pocket, magnetic laptop sleeve with standoff, expandable magnetic bottle pockets). Version history only. Discloses: Co-maker''s own store page.'
    used_for: []
  sourcing: The For points and one Against point come from a video review of the first EDX (2023). Also based on Matador's and Carryology's own pages, plus my own bag for how it opens and stands.
