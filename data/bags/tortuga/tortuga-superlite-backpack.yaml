    about: same build; tested during the Kickstarter, sample status not stated
  - source: nomads-nation-tortuga-superlite-review
    about: same build; sample status not stated
  - source: hafu-way-there-video-tortuga-superlite
    about: same build; first impressions after a couple of days; bag sent by Tortuga, not paid
  - source: away-together-video-tortuga-superlite-review
    about: same build; bag sent by Tortuga; affiliate links
  - source: visionswell-video-tortuga-superlite-backpack-review
    about: same build (white prototype colour); first look; bag sent by Tortuga; affiliate links
  - source: one-bag-travels-video-tortuga-superlite-ultra-review
    about: same build; taken on a couple of trips; affiliate link, sample status not stated
  - source: the-perfect-bag-video-tortuga-superlite
    about: same build (white prototype); used on a four-day trip; prototype lent by Tortuga
  - source: kickstarter-superlite-backpack-comments
    about: same build; a backer's comments after his bag arrived, on Tortuga's campaign page
  replaces: slite-pro-1
  wording_note: 'Both hands-on reviews found the harness comfortable; flourish and weight (a data field) removed. ''Dual-density'' is maker-only, split to -b. 17 Nov 2026: support widened with Hafu Way There, Away Together w/ Nik and Allie, visionswell, One Bag Travels, The Perfect Bag, Kickstarter backer comments (research/reviews-2026-11-17/merged/slite.json point 0; research/reviews-2026-11-17/merged/slite2.json point 0); was ''reviewers agree''. Hafu Way There, Away Together, visionswell, One Bag Travels, The Perfect Bag and a Kickstarter backer all call the harness or carry comfortable. Pack Hacker''s video repeats its written review and is not counted again.'
