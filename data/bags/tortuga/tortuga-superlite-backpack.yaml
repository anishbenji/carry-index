  - source: pack-hacker-superlite-backpack
    covers: 'Tortuga Superlite Backpack 34L, Challenge ULTRA 200TX (same build as card); tested for a week; published 2026-06-16, updated 2026-08-17. Page does not mention Kickstarter-era testing (ctx ''covers'' says it does). Discloses: Reader-supported, may earn affiliate commission (Avantlink links to Tortuga); promotes ''up to 15% off Tortuga'' for Pro members. Sample/purchase status not stated.'
    used_for:
    - slite-pro-1
    - slite-pro-3
    - slite-pro-5
    - slite-con-2
    - slite-con-3
  - source: nomads-nation-tortuga-superlite-review
    covers: 'Tortuga Superlite 34L, ULTRA (Ultra Black; same build); tested weight ~2.1 lb; published 2026-07-14, updated 2026-11-11; author Aaron Radcliffe. Discloses: No affiliate or sample disclosure in page text; ''Check Best Price'' redirect links. Author founded Fyro and promotes its Levo backpack in Alternatives (competing-interest).'
    used_for:
    - slite-pro-1
    - slite-pro-3
    - slite-con-2
    - slite-con-3
    - slite-note-1
  - source: hafu-way-there-video-tortuga-superlite
    covers: 'Superlite 34L in ULTRA, 2.2 lb (said in video and description); first hands-on impressions, ''I''ve only had this bag for a couple days''; 5:28, uploaded 2026-06-16, before the Kickstarter. Discloses: Tortuga sent the bag early for review; not paid; Tortuga did not review or approve content; Kickstarter link may be an affiliate link.'
    used_for:
    - slite-pro-1
    - slite-pro-3
    - slite-con-2
    - slite-pro-7
    - slite-con-5
  - source: carry-on-club-tortuga-superlite-early-impressions
    covers: 'Superlite 26L (stated in page meta description, not body), white colourway, ULTRA; one ~5-mile day hike in Oregon heat; early impressions only. Different size from the 34L card. Discloses: Affiliate links marked. Sample vs purchase not stated (author refers to ''owning'' an ULTRA bag). Page dated only ''2026''.'
    used_for: []
  - source: pack-hacker-video-tortuga-superlite-backpack-review
    covers: 'Superlite Backpack 34 L, 2.2 lb, ULTRA 200TX; pre-production sample (said to precede Kickstarter version, may differ slightly); tested for one week; hip belt tested; 16-in MacBook Pro in sleeve. Colour not stated in transcript. Uploaded 2026-06-16. Discloses: Pack Hacker Reviews channel: same publisher and same tester (Lauren, 5 ft 6 in, 16.5 in torso) as the on-file Pack Hacker written review, which the description links to; NOT an independent voice, count Pack Hacker once. Description carries Pack Hacker affiliate-link and Amazon Associates terms. Says it is a pre-production sample; who supplied it and whether paid is not stated.'
    used_for:
    - slite-con-7
  - source: away-together-video-tortuga-superlite-review
    covers: 'Superlite 34 L, ULTRA 200TX, 2.2 lb; production colour not shown/stated; length of use not stated (''getting to know'' the bag). Uploaded 2026-06-16 (launch day). Discloses: Says Tortuga sent the bag for testing and has no influence over what is said. Description: Tortuga link via tortuga.kckb.me referral plus awaytogether.com/go links; affiliate notice (''some of the product links are affiliate links''). Asks viewers to use the links. No payment stated.'
    used_for:
    - slite-pro-1
    - slite-pro-3
    - slite-con-7
  - source: visionswell-video-tortuga-superlite-backpack-review
    covers: 'Superlite 34 L, ULTRA, 2.2 lb; WHITE early-prototype colourway, said not commercially available or planned; hip belt (white) tested. First-look review; reviewer is a personal-item-only traveller. Uploaded 2026-06-16. Design points count; fabric look/colour does not. Discloses: Says Tortuga sent it for test and review; opinions his own. Description: Kickstarter link via visionswell shortlink, affiliate disclosure, Amazon Associates, and free-gear disclosure. No payment stated.'
    used_for:
    - slite-pro-1
    - slite-pro-7
  - source: one-bag-travels-video-tortuga-superlite-ultra-review
    covers: 'Superlite 34 L, ULTRA 200TX, 2.2 lb; taken on ''a couple of trips'' before filming; compared with Tortuga Light 40. Colour not stated. Uploaded 2026-07-14. Discloses: Description: affiliate referral link to Tortuga (onebagtravels.com/refer) and affiliate/Amazon Associates disclaimer. Whether the bag was supplied or bought is not stated.'
    used_for:
    - slite-pro-1
    - slite-pro-3
    - slite-con-5
  - source: unpackd-video-tortuga-superlite-review
    covers: 'Superlite 34 L, ULTRA 200TX; WHITE sample colourway (says Kickstarter is black only); one week of daily use, says so himself; 3-mile humid-day trail walk. Uploaded 2026-06-16. Design points count; fabric look/colour (patina, wrinkles) does not. Discloses: Received the bag in exchange for a review; no payment, brands have no say; thanks Tortuga for sending it. Description: affiliate links (unpackd.link/tortuga, Amazon). Reads out a Tortuga co-founder''s Facebook-group reply.'
    used_for:
    - slite-con-3
    - slite-pro-6
    - slite-con-6
    - slite-note-1
  - source: nitpacker-video-tortuga-superlite
    covers: 'Superlite 34 L, ULTRA, 2.2 lb; WHITE review/PR sample colourway (says public version is black/grey only); his first Tortuga bag; hip belt shown; length of use not stated. Uploaded 2026-06-16. Design points count; fabric look/colour does not. Discloses: Description link marked ''(affiliate)'' (tidd.ly). Implies the white bag is a review/PR sample; does not say who supplied it or whether paid. Mentions testing another Tortuga bag.'
    used_for:
    - slite-pro-6
    - slite-con-5
    - slite-note-1
  - source: outen-the-lights-video-tortuga-superlite-pack-with-me
    covers: 'Superlite 34 L, ULTRA 200TX, 2.2 lb, BLACK (the sold colour); launch-day pack-with-me for a 2-week trip (packing demo, not 2 weeks of use); little spoken opinion. Uploaded 2026-06-16. Discloses: Description: Tortuga link (alnk.to), Fyro referral, Pioneer Carry tidd.ly link, Field Notes affiliate code; no explicit affiliate statement. Sample or purchase not stated.'
    used_for:
    - slite-pro-3
    - slite-con-2
  - source: the-perfect-bag-video-tortuga-superlite
    covers: 'Superlite 34 L (label read on camera; he also says ''35 L'', ''2 lb''), ULTRA; WHITE prototype colourway, says sold version is black; used on a 4-day trip to Iowa. Uploaded 2026-06-16. Design points count; fabric look/colour (scuffing on white) does not. Discloses: Thanks Tortuga for letting him go hands-on with a prototype. Description: no payments or sponsorship from bag makers, no affiliate links to bag makers (Amazon affiliate links used); but on camera he calls the Kickstarter link an affiliate link. Description''s ''This Bag'' link is empty.'
    used_for:
    - slite-pro-1
    - slite-pro-3
    - slite-con-2
    - slite-con-3
    - slite-con-6
  - source: kickstarter-superlite-backpack-comments
    covers: 'Delivered retail Superlite Backpack: Benji posts ''Mine just arrived (Aus)!'' about 28 days before the scrape, Tortuga replies that international Batch 1 has shipped; next day he answers his order number ''249'' and gives his opinion. He names Ultra 200TX. Colour not stated (only black is sold). Short-term owner impressions. Discloses: Owner post by a campaign backer (bought via Kickstarter), on the maker''s campaign page where Tortuga staff reply. No affiliate or sample involvement.'
    used_for:
    - slite-pro-1
    - slite-con-2
    - slite-pro-6
