claims:
- id: slite-pro-1
  kind: pro
  text: Comfortable harness, with load lifters and a channelled back panel.
  voice: reviewers
  support: eight reviewers and owners agree
  scope: design
  basis: review
  sources:
  - pack-hacker-superlite-backpack
  - nomads-nation-tortuga-superlite-review
  - hafu-way-there-video-tortuga-superlite
  - away-together-video-tortuga-superlite-review
  - visionswell-video-tortuga-superlite-backpack-review
  - one-bag-travels-video-tortuga-superlite-ultra-review
  - the-perfect-bag-video-tortuga-superlite
  - kickstarter-superlite-backpack-comments
  observed_on:
  - superlite-backpack
  status: approved
  source_notes:
