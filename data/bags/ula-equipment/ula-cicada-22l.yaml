    note: 'Confirmed quotes. Pack Hacker: "It’s incredibly lightweight, so much so that you notice it while carrying the bag."; ULA Equipment: "lightweight, looks great and is very practical"'
    checked: '2026-11-17'
    method: Research subagent found the sources; a separate checking subagent re-opened each one and confirmed the quotes.
  wording_note: 'Added 17 Nov 2026 from the wider source search. Anish read and approved this wording the same day (his comment on the reading list: ''yes''). research/reviews-2026-11-17/merged/cicada.json point 1.'
  added_in: reviews-2026-11-17
