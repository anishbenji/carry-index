claims:
- id: cicada-pro-2
  kind: pro
  text: 'Self-stands very well: one owner says better than any bag they have used.'
  voice: owners
  support: one owner review
  scope: design
  basis: owner-reports
  sources:
  - ula-ultra-cicada-ewp
  observed_on:
  - ultra-cicada-ewp
  status: approved
  source_notes:
  - source: ula-ultra-cicada-ewp
    about: same build (ULTRA 400TX Cicada, EWP version)
  other_builds:
  - source: ula-equipment-p-536810
    about: pre-launch Cicada, standard version (before the EWP existed); maker statement that it stands on its own
  replaces: cicada-pro-2
  wording_note: Anish asked for "general consensus is that it self stands very well". The sources on file are one owner review and ULA's own launch Q&A; Pack Hacker and The Brooks Review do not mention it. So the line says one owner, and ULA's statement is a "Maker says" line. He agreed to both.
- id: cicada-pro-4
  kind: pro
  text: The EWP's water bottle pockets sit flush with the sides and disappear when empty.
  voice: owners
  support: one owner review
  scope: design
  basis: owner-reports
  sources:
  - ula-ultra-cicada-ewp
  observed_on:
  - ultra-cicada-ewp
  status: approved
  source_notes:
  - source: ula-ultra-cicada-ewp
    about: same build (ULTRA 400TX Cicada, EWP version); the description does not say the pockets lie flat or vanish
  - source: ula-ultra-cicada-ewp
    about: same build (ULTRA 400TX Cicada, EWP version)
  other_builds:
  - source: pack-hacker-cicada
    about: standard Cicada with internal bottle pockets; lists the lack of external bottle pockets as a con (indirect support only, no EWP comparison)
  replaces: cicada-pro-4
  wording_note: 'Anish''s wording, with "the sides" for "the body". The owner review says the pockets are nearly invisible when empty. "Flush" was checked by Claude on 13 Nov 2026 against ULA''s front and left-side photos of the ULTRA Cicada EWP, opened in the browser: the mesh pockets lie flat against the side panels and do not break the bag''s outline.'
- id: cicada-note-1
  kind: note
  text: A 16-inch MacBook Pro fits easily; a bulkier 16-inch Dell did not.
  voice: owners
  support: two owner reviews
  scope: design
  basis: owner-reports
  sources:
  - ula-ultra-cicada-ewp
  observed_on:
  - ultra-cicada-ewp
  status: approved
  source_notes:
  - source: ula-ultra-cicada-ewp
    about: same build (ULTRA 400TX Cicada, EWP version)
  - source: ula-ultra-cicada-ewp
    about: same build (ULTRA 400TX Cicada, EWP version)
  other_builds:
  - source: ula-equipment-p-538083
    about: launch-time standard Cicada; maker says the sleeve is designed for a 16-inch MacBook Pro (product pages give only 15.5 x 10 in sleeve, 10 in opening)
  - source: pack-hacker-cicada
    about: standard Cicada; tested only a 15-inch laptop, which fit
  replaces: cicada-con-1
  wording_note: 'Anish: neither a pro nor a con, since few bags take laptops much bigger than a 16-inch MacBook Pro. Filed as a "Good to know" note beside the laptop sleeve spec (15.5 x 10 in, 10 in opening, by ULA''s page).'
  about: laptop
- id: cicada-pro-7
  kind: pro
  text: Very light to carry.
  voice: reviewers
  support: one review and one owner review
  scope: material
  basis: review
  sources:
  - pack-hacker-cicada
  - ula-ultra-muse-cicada
  observed_on:
  - ultra-cicada
  - ultra-muse-cicada-ewp
  status: approved
  source_notes:
  - source: pack-hacker-cicada
    about: same build (standard ULTRA Cicada, not the EWP); two weeks of use; affiliate links, sample status not stated
  - source: ula-ultra-muse-cicada
    about: same build (ULTRA Muse Cicada EWP); one verified-owner review on ULA's own page
  evidence:
