features: []
claims:
- id: dfly-pro-1
  kind: pro
  text: Treeline calls it the lightest true travel pack it has tested.
  voice: reviewers
  support: one review
  scope: material
  basis: review
  sources:
  - treeline-review-ula-ultra-30l-dragonfly-pack-review
  observed_on:
  - 30l-ultra-dragonfly
  status: approved
  source_notes:
  - source: treeline-review-ula-ultra-30l-dragonfly-pack-review
    about: same build (ULA Ultra 30L Dragonfly, 27.4 oz); the same review notes the ULA Ultra Node is lighter
  other_builds:
  - source: carryology-ula-ultra-dragonfly-review
    about: 30L Ultra Dragonfly in Ultra 800 (pre-TX fabric), listed at 30 oz and $249.99
  - source: treeline-review-ula-ultra-node-20l-pack-review
    about: ULA Ultra Node 20L (a different bag)
  replaces: dfly-pro-1
  wording_note: Split. Uses Treeline's qualified wording; the review says the Ultra Node is lighter but lacks features.
- id: dfly-pro-2
  kind: pro
  text: The tall mesh side pockets fit a 64 oz water bottle with ease.
  voice: reviewers
  support: one review
  scope: design
  basis: review
  sources:
  - treeline-review-ula-ultra-30l-dragonfly-pack-review
  - ula-ultra-30l-patchless-dragonfly
  observed_on:
  - 30l-ultra-dragonfly
  - 30l-patchless-ultra-dragonfly
  status: approved
  source_notes:
  - source: ula-ultra-30l-patchless-dragonfly
    about: same build (30L Ultra Dragonfly, ULTRA 400TX / 800TX)
  - source: treeline-review-ula-ultra-30l-dragonfly-pack-review
    about: same build (ULA Ultra 30L Dragonfly); says the side pockets take a 64 oz bottle; no tripod or hall-of-fame wording
  other_builds:
  - source: pack-hacker-dragonfly
    about: 30L Dragonfly in X50 X-Pac, earlier generation (not Ultra); 32 oz bottle fits, travel tripod fits, a regular tripod needs the compression straps
  - source: carryology-ula-ultra-dragonfly-review
    about: 30L Ultra Dragonfly in Ultra 800; full-size Nalgene with room to spare, pockets also suggested for a tripod
  - source: pack-hacker-ultra-36l-dragonfly
    about: 36L Ultra Dragonfly (larger size); 48 oz Nalgene and a tripod fit; no hall-of-fame wording
  replaces: dfly-pro-2
  wording_note: Split. 'Hall of fame' dropped (one reviewer, 2022 X-Pac build). Treeline and ULA's page support 64 oz.
- id: dfly-pro-2-b
  kind: pro
  text: A travel tripod fits a side pocket, but a full-size tripod needs the compression straps.
  voice: reviewers
  support: two reviews
  scope: design
  basis: sibling
  sources:
  - pack-hacker-dragonfly
  - the-mountainborn-video-ula-dragonfly-ultra-30
  observed_on:
  - 30l-ultra-dragonfly
  from_build:
    label: Also from a review of the 2022 X-Pac build
    generation: Earlier build, reviewed in 2022
    size: Same, 30L
    fabric: X-Pac X50
    assigned: 'yes'
    found: ULA's current page says the side pockets fit 64 oz bottles and does not mention tripods.
    decided: '2026-11-13'
  status: approved
  source_notes:
  - source: pack-hacker-dragonfly
    about: 30L Dragonfly in X50 X-Pac, earlier generation (not Ultra); 32 oz bottle fits, travel tripod fits, a regular tripod needs the compression straps
  - source: the-mountainborn-video-ula-dragonfly-ultra-30
    about: same build (30L Ultra Dragonfly, ULTRA 400TX); a couple of months of use; bought with his own money
  replaces: dfly-pro-2
  wording_note: 'Split from pro-2. ''Full tripods'' was unsupported. Pack Hacker tested the X-Pac build; pocket design, so kept as sibling. 17 Nov 2026: support widened with The Mountainborn (research/reviews-2026-11-17/merged/dfly.json point 4); was ''one review''. The Mountainborn (30L Ultra Dragonfly) carried a tripod in the side pocket under the strap every day for two weeks. Build label changed from ''From a review of the 2022 X-Pac build'' to ''Also from a review of the 2022 X-Pac build'' to fit the wider sources.'
- id: dfly-pro-3
  kind: pro
  text: Just the right amount of organisation.
  voice: reviewers
  support: two reviews
  scope: design
  basis: review
  sources:
  - treeline-review-ula-ultra-30l-dragonfly-pack-review
  - danny-packs-video-ula-dragonfly-ultra-30l-review
  observed_on:
  - 30l-ultra-dragonfly
  status: approved
  source_notes:
  - source: treeline-review-ula-ultra-30l-dragonfly-pack-review
    about: same build (ULA Ultra 30L Dragonfly)
  - source: danny-packs-video-ula-dragonfly-ultra-30l-review
    about: same build (30L Ultra Dragonfly); he bought it himself; affiliate links
  other_builds:
  - source: carryology-ula-ultra-dragonfly-review
    about: 30L Ultra Dragonfly in Ultra 800; describes the pocket set but not in 'just enough' terms; a more qualified view
  replaces: dfly-pro-3
  wording_note: 'One reviewer (Treeline), not ''reviewers''. Carryology is more qualified: items sink and it suggests pouches. 17 Nov 2026: support widened with Danny Packs (research/reviews-2026-11-17/merged/dfly.json point 9); was ''one review''. Danny Packs (30L Ultra Dragonfly) says ''it provides the right amount of organization''. Reworded the same day from ''Just enough pockets, in the right places, and easy to reach even when the pack is stuffed.'' to ''Just the right amount of organisation.''. Anish accepted this wording on 17 Nov 2026 (''ok''), so that the line says only what both sources back; easy reach when the pack is stuffed was Treeline Review''s point alone.'
- id: dfly-pro-4
  kind: pro
  text: Comfortable to wear.
  voice: reviewers
  support: three reviewers and owners agree
  scope: design
  basis: review
  sources:
  - treeline-review-ula-ultra-30l-dragonfly-pack-review
  - danny-packs-video-ula-dragonfly-ultra-30l-review
  - ula-ultra-dragonfly
  observed_on:
  - 30l-ultra-dragonfly
  status: approved
  source_notes:
  - source: treeline-review-ula-ultra-30l-dragonfly-pack-review
    about: same build; S-straps as on ULA's thru-hiking packs; 25 lb cited as the rated limit (low end, not for heavy packers), tester reported no comfort problems
  - source: danny-packs-video-ula-dragonfly-ultra-30l-review
    about: same build (30L Ultra Dragonfly); he bought it himself; affiliate links
  - source: ula-ultra-dragonfly
    about: same build (30L Ultra Dragonfly); customer reviews on ULA's own page, most without naming the fabric
  other_builds:
  - source: ula-ultra-dragonfly
    about: 30L Ultra Dragonfly; Harris names the earlier Ultra 800 fabric; Koffler's review is dated 2023-10-11
  - source: carryology-ula-ultra-dragonfly-review
    about: 30L Ultra Dragonfly in Ultra 800; praises the straps but wants a little more padding and would keep loads near 20 lb
  replaces: dfly-pro-4
