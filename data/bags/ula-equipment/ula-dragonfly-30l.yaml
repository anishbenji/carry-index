    covers: 30L Dragonfly, fabric not shown on the page; several commenters say the front stretch pocket's zipper opening is too small
    used_for:
    - dfly-con-2
  - source: carryology-ula-ultra-dragonfly-review
    covers: '30L Ultra Dragonfly in Challenge Ultra 800 (earlier, pre-TX build; 30 oz, US$249.99); Brandon, 2023-01-19. Sibling build. Discloses: Buy links go through an affiliate redirect (ula-equipment.9xrw.net); no disclosure statement or sample source stated in the main content.'
    used_for:
    - dfly-con-3-c
    - dfly-con-4
  - source: treeline-review-ula-ultra-node-20l-pack-review
    covers: ULA Ultra Node 20L (a different bag)
    used_for: []
  - source: pack-hacker-ultra-36l-dragonfly
    covers: 36L Ultra Dragonfly (larger size); 48 oz Nalgene and a tripod fit; no hall-of-fame wording
    used_for: []
  - source: nomads-nation-ula-dragonfly
    covers: '30L Dragonfly, orange/black, fabric not named (spec table: materials vary by batch, e.g. X-Pac, Cordura); generation unclear (mentions 2.3 lb older and 1.7 lb newer models); published 2025-08-29, updated 2026-11-11. Not the Ultra build as far as the page shows: label as another fabric. Discloses: No affiliate disclosure statement in the main content, but ''Best Black Friday Deal''/''Check Best Price'' links (redirects via blog.nomadsnation.com) and affiliate-network links for alternatives; does not say how the bag was obtained. Promotes the author''s own bag brand (Fyro, ''The Bag Brand I Founded'') as the first alternative: a competing commercial interest.'
    used_for: []
  - source: danny-packs-video-ula-dragonfly-ultra-30l-review
    covers: '30L Ultra Dragonfly; he says the fabric is Challenge Ultra 400; uploaded 2024-08-14. Discloses: Description has an affiliate disclosure (Amazon Associates and other links). In the video he says he bought the bag himself after a restock; no sponsorship.'
    used_for:
    - dfly-pro-3
    - dfly-pro-4
  - source: the-mountainborn-video-ula-dragonfly-ultra-30
    covers: '30L Ultra Dragonfly with patch, Ultra 400TX Black Magic, Fidlock sternum upgrade; a couple of months of use; uploaded 2024-10-25. Discloses: Says the bag was purchased with his own money; no affiliate or sponsorship found.'
    used_for:
    - dfly-pro-2-b
    - dfly-con-1
    - dfly-con-4
  - source: pack-and-roam-video-ula-dragonfly-30l-review
    covers: '30L Ultra Dragonfly, Ultra 400TX Black Magic; about a month of EDC and work travel; uploaded 2024-12-06. Discloses: Description: affiliate links (incl. Amazon Associate) and a general note that he occasionally receives free gear; in the video he says he picked this one up himself.'
    used_for:
    - dfly-con-1
  - source: chase-reeves-video-ula-dragonfly
    covers: '30L Dragonfly Pass Thru worn as his EDC, shown next to a 36L (not Pass Thru); fabric called ''ultra material'', grade not stated; some segments do not make clear which size is in hand; uploaded 2025-03-23. Discloses: Says ULA sent him the bags and did not pay for the review; paid Nomadix segment (YouTube ''Includes paid promotion''); description affiliate links.'
    used_for: []
  - source: nomads-nation-ula-dragonfly-pass-thru-review
    covers: '30L Ultra Dragonfly Pass-through (30L Dragonfly Pass Thru), Ultra 400 TX; a couple of weeks of commuting/gym use; URL redirects to nomadsnation.com/ula-dragonfly-pass-thru-review/; published 2026-11-10. Discloses: No affiliate disclosure statement; ''Check Best Price'' links; does not say whether the bag was bought or provided. Same publisher as s5 and promotes the site''s own brand (Fyro, ''The Bag Brand We Founded'').'
    used_for:
    - dfly-con-4
  - source: iron-heart-forum-903570
    covers: 'Thread page loads at topic 875 page 1885; the quoted post (903505, 2025-07-21) is about a 36L Ultra Dragonfly Pass-Through, Ultra fabric: a different size. Discloses: Owner forum post; no disclosures.'
    used_for: []
  sourcing: Based on Treeline Review's review of the 30L Ultra Dragonfly, video reviews from The Mountainborn, Pack & Roam and Danny Packs, owner reviews on ULA's site and r/onebag, Nomads Nation's review of the Pass Thru, reviews of earlier builds from Pack Hacker and Carryology, plus ULA's own pages.
