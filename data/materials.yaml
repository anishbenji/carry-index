ultra-400x:
  name: ULTRA 400X
  maker: Challenge Sailcloth
  family: ULTRA X
  fibre: UHMWPE
  construction: UHMWPE and high-tenacity polyester woven face, Ultra cross-ply, 0.75 mil PET film
  uhmwpe_role: face
  uhmwpe_content:
    published: false
    statement: Challenge names it without a blend or weight. ULA gives 5.25 oz/yd² (178 g/m²); retailer Extremtextil gives a 67/33 UHMWPE and polyester face.
    source: https://www.challenge-outdoor.com/ultra-weave
  in_uhmwpe_section:
    decision: in
    reasons: On the page since before the three tests were written down; reasons against the tests still to be written
    decided: before 2026-11-13
    draft:
      test1_role:
        finding: 'Challenge describes Ultra400X as a 400d Ultra-PE face woven with high-tenacity polyester and laminated to PET film. Percentage: not published by Challenge; retailer Extremtextil gives a 67/33 UHMWPE and polyester face.'
        sources:
        - https://www.challenge-outdoor.com/ultra-weave
        - https://www.extremtextil.de/en/ultra-400-x-backpack-laminate-with-uhmwpe-178g-sqm/72683
      test2_positioning:
        finding: 'Challenge''s claims: about 20% lighter than other 400d U-PE fabrics, four times their abrasion resistance, and the UHMWPE fibre''s 15-times-steel strength. The 20% baseline is not spelled out.'
        sources:
        - https://www.challenge-outdoor.com/ultra-weave
        - https://www.challenge-outdoor.com/ultra-collection
      test3_experience:
        finding: 'Maker figures: Aer''s City Pack Pro 2 24L is 2.57 lb in Ultra against 2.86 lb in Cordura, and its Travel Pack 4 28L 3.28 lb against 3.52 lb. Stranded Variable (review, bag supplied by Aer) describes a light crinkle and a paper-like feel.'
        sources:
        - https://aersf.com/products/city-pack-pro-2-ultra-24l
        - https://aersf.com/products/city-pack-pro-2-24l
        - https://aersf.com/products/travel-pack-4-ultra-28l
        - https://aersf.com/products/travel-pack-4-28l
        - https://www.strandedvariable.com/posts/review-aer-city-pack-pro-2-24l-ultra
      suggested_decision: in
      why_here: Challenge builds the face from UHMWPE and rests its weight and abrasion claims on it; Aer's Ultra bags weigh less than their Cordura twins.
      gaps:
      - No published UHMWPE share from Challenge; only a retailer's 67/33 figure.
      - Weight savings on file are modest (about 7 to 10% on Aer's figures); whether that counts as clearly lighter is an editorial call.
      - Retailer Rushfaster's metric weights for both Aer Ultra bags do not match Aer's own pound figures.
      status: awaiting approval
      drafted: '2026-11-13'
