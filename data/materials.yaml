ultra-200x:
  name: ULTRA 200X
  maker: Challenge Sailcloth
  family: ULTRA X
  fibre: UHMWPE
  construction: UHMWPE and high-tenacity polyester woven face, Ultra cross-ply, 0.75 mil PET film
  uhmwpe_role: face
  uhmwpe_content:
    published: false
    statement: 'Challenge gives no share. Retailer Extremtextil lists both 43% and 67% UHMWPE on its page. Fabric weight differs by source: 4.6 oz/yd² on Challenge''s UltraWeave page, 3.9 oz/yd² (133 g/m²) at ULA and Extremtextil.'
    source: https://www.challenge-outdoor.com/ultra-weave
  in_uhmwpe_section:
    decision: in
    reasons: On the page since before the three tests were written down; reasons against the tests still to be written
    decided: before 2026-11-13
    draft:
      test1_role:
        finding: 'Challenge says UltraWeave is woven from a blend of UHMWPE and high-tenacity polyester, laminated to PET film, so the fibre is in the woven face. Percentage: not published by Challenge; retailer Extremtextil lists both 43% and 67% UHMWPE.'
        sources:
        - https://www.challenge-outdoor.com/ultra-weave
        - https://www.extremtextil.de/en/ultra-200-x-backpack-laminate-with-uhmwpe-133g-sqm/72682
      test2_positioning:
        finding: 'Challenge''s UltraWeave and ULTRA pages present the range as UHMWPE fabrics and tie strength to the fibre (its claim: 15 times steel by weight). Its waterproof claim (200 psi) rests on the film, not the fibre; the 200X superlative has no data.'
        sources:
        - https://www.challenge-outdoor.com/ultra-weave
        - https://www.challenge-outdoor.com/ultra
      test3_experience:
        finding: 'Maker figures: the Evergoods CTB26 in ULTRA 200X is 1459 g against 1587 g for the 420D nylon CTB26, about 8% lighter. No review on file describes the look or feel of a 200X bag against a nylon one.'
        sources:
        - https://evergoods.us/products/civic-travel-bag-ultra
        - https://evergoods.us/products/civic-travel-bag-26l
      suggested_decision: in
      why_here: Challenge weaves UHMWPE into the face itself and rests its strength claims on that fibre; the CTB26 in it weighs less than the nylon version.
      gaps:
      - No published UHMWPE share from Challenge; Extremtextil gives two different figures (43% and 67%).
      - 'Fabric weight conflicts: 4.6 oz/yd² on Challenge''s UltraWeave page against 3.9 oz/yd² at ULA and Extremtextil.'
      - No review or owner handling on file comparing the feel of a 200X bag with a nylon one.
      - No nylon-versus-200X weight comparison on file for the Ctactical bags.
      status: awaiting approval
      drafted: '2026-11-13'
