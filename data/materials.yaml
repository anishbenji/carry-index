axodyne:
  name: Axodyne
  maker: ALPAKA (its own name for the fabric; mill not stated)
  family: Axodyne
  fibre: UHMWPE
  construction: 'ALPAKA''s Kickstarter campaign: UHMWPE fibres laid at 0° and 90°, a nylon reinforcing mesh and a TPU film layer. Its "What is Axodyne?" video: two layers, UHMWPE fibres on top as a reinforcing mesh, not a woven fabric, with a TPU coat on the back.'
  uhmwpe_role: fibre-layer
  uhmwpe_content:
    published: false
    statement: Role as ALPAKA's Kickstarter campaign describes it; its video calls the same layer a reinforcing mesh. No percentage, weight or denier in the campaign or in any of the four ALPAKA videos opened.
    source: https://www.kickstarter.com/projects/alpaka/momentum-collection-light-on-weight-heavy-on-durability
  in_uhmwpe_section:
    decision: in
    decided: '2026-11-13'
    reasons: 'Anish''s call, 13 Nov 2026, after reading what ALPAKA''s campaign and videos say. His reasons, given earlier that day: ALPAKA launched it as a step up from its Axoflux fabric and promoted the UHMWPE content, strength, tear resistance and waterproofing; and the Momentum Collection bags, which he owns, are lighter and have the technical look and feel that sets UHMWPE bags apart from nylon ones. The share of UHMWPE is not published. No Axodyne bag is in the data yet.'
    draft:
      alpaka_campaign_and_videos:
      - source: alpaka-kickstarter-momentum-collection
        says: 'A multi-layer build: UHMWPE fibres laid at 0° and 90°, a nylon reinforcing mesh that gives the grid texture, and a TPU film. Claims it is lighter than nylon and far stronger, and likens the fibre to the one in Dyneema and Ultra. No percentage, weight or denier. Axoflux is not mentioned. No country of manufacture.'
      - source: alpaka-video-what-is-axodyne
        says: 'Two layers: UHMWPE fibres on top, described as a reinforcing mesh and not a woven fabric (which is why contents show through), with a TPU coat on the back. Mentions 210D and 600D fabric in passing and contrasts Axodyne with ordinary nylon and polyester. No percentage.'
      - source: alpaka-video-momentum-kickstarter
        says: Calls it a single layer composite. Waterproof, abrasion-resistant and light; no construction detail.
      - source: alpaka-video-momentum-collection-deep-dive
        says: Waterproof, abrasion-resistant and light; no construction detail.
      - source: alpaka-video-white-axodyne-deep-dive
        says: Adds nothing on the fabric.
      reading: By ALPAKA's account the UHMWPE is a laid grid of fibres inside a laminate with no woven nylon face. That is not the gridstop case the disqualifier describes (UHMWPE threads in an ordinary nylon weave), but ALPAKA itself calls the fibre layer a mesh. Anish ruled it in on 13 Nov 2026.
      open_points:
      - 'UHMWPE share: not published anywhere found.'
      - No ALPAKA material found comparing Axodyne with Axoflux, though Anish recalls the launch doing so.
      - Anish owns Momentum Collection bags; his handling notes are not recorded yet.
      status: 'decision made: in; the wording of the reason shown on the page is still to write'
      drafted: '2026-11-13'
  checks:
  - date: '2026-11-13'
    source: alpaka-kickstarter-momentum-collection
    basis: page
    method: Opened by Claude through Firecrawl on 13 Nov 2026
    fields:
    - uhmwpe_content
  - date: '2026-11-13'
    source: alpaka-video-what-is-axodyne
    basis: page
    method: Opened by Claude through Firecrawl on 13 Nov 2026; transcript, not the video itself
    fields:
    - uhmwpe_content
