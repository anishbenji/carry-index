aluula-graflyte:
  name: ALUULA Graflyte
  maker: ALUULA Composites
  family: ALUULA
  fibre: UHMWPE
  construction: Fused without adhesives, by ALUULA's general description of its fabrics; Graflyte is not described separately on ALUULA's technology page
  uhmwpe_role: fused-film
  uhmwpe_content:
    published: true
    statement: ALUULA says its fabrics are 100% polyethylene. Db lists the bag's main material as 100% polyethylene (ALUULA Graflyte). Trade coverage citing ALUULA reports woven 100% UHMWPE in 52, 78 and 98 g/m².
    source: https://aluula.com/technology/
  in_uhmwpe_section:
    decision: in
    reasons: On the page since before the three tests were written down; reasons against the tests still to be written
    decided: before 2026-11-13
    draft:
      test1_role:
        finding: 'ALUULA says its fabrics are 100% polyethylene, fused without adhesives; its pages do not describe Graflyte on its own or use the word UHMWPE. Garage Grown Gear, quoting ALUULA staff, reports 100% UHMWPE. Percentage: 100% polyethylene (published).'
        sources:
        - https://aluula.com/technology/
        - https://aluula.com/materials-outdoor-gear/
        - https://garagegrowngear.com/blogs/gear-gab/aluula-graflyte-weaving-a-new-future-for-ultralight-fabric
      test2_positioning:
        finding: 'ALUULA''s claims rest on the single-polymer, adhesive-free build: stronger than steel for its weight, waterproof, UV-resistant, recyclable. It presents a polyethylene fabric, not one named as UHMWPE, on the pages opened.'
        sources:
        - https://aluula.com/technology/
        - https://aluula.com/materials-outdoor-gear/
      test3_experience:
        finding: 'Db''s claim: the Weigh Lighter Hugger 30L, at 520 g, is 54% lighter than the standard Hugger. No hands-on review is on file; T3''s launch piece calls it translucent but the writer had not handled it.'
        sources:
        - https://dbjourney.com/en-us/products/weigh-lighter-hugger-backpack-30l-weigh-darker
        - https://t3.com/active/outdoors/i-thought-i-had-the-perfect-adventure-bag-until-i-saw-dbs-new-weigh-lighter-backpacks
      suggested_decision: in
      why_here: ALUULA makes the whole fabric from polyethylene, fused without glue; Db says its bag in it is 54% lighter than the standard Hugger.
      gaps:
      - ALUULA's own pages say polyethylene, not UHMWPE; the UHMWPE wording comes from trade coverage quoting ALUULA.
      - 'Construction conflict: materials.yaml records trade coverage calling it woven; Garage Grown Gear and ALUULA say fused and do not say woven.'
      - No hands-on review of a Graflyte bag on file; test 3 rests on Db's own claim.
      - Db does not publish the standard Hugger's weight on the page opened.
