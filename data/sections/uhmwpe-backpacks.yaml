# One listing page.
id: uhmwpe-backpacks
title: UHMWPE backpacks
category: backpack
rule:
  category: backpack
  shell_material: in_uhmwpe_section.decision == in
  tests:
  - 'The fibre does real work: UHMWPE is a main structural part of the fabric, going by the maker''s own description'
  - The maker sells it as a UHMWPE fabric
  - 'Bags in it stand apart from the maker''s nylon bags the way UHMWPE bags usually do: lighter, with the technical look and feel'
  disqualifier: A fabric is out if UHMWPE is only a ripstop grid or a minor reinforcement in an ordinary nylon or polyester weave
scope_note: 'EDC and travel backpacks with a UHMWPE fabric shell. Which fabrics count is my call, fabric by fabric. Three things I look at:'
approach_note: These pages put checked specs next to what reviewers and owners broadly agree on. As I get to review bags myself, I'll add my own reviews or link to them.
exclusions:
- name: Able Carry Max EDC
  reason: I found no sign that Able Carry has released a Challenge ULTRA build
  decided: before Rev AE; date not recorded
revision:
  letter: AN
  date: '2026-11-18'
